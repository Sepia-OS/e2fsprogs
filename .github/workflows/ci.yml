name: CI

# Every commit on every branch, every pull request against main, and the push
# that lands when a pull request is merged into main.
#
# Tag pushes deliberately do not match: `branches:` never matches a tag ref, so
# cutting a release cannot start a second pipeline for the commit it just built.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede the previous run for the same branch or PR. A branch that also has
# an open PR gets one run per event in two separate groups, so neither run can
# cancel the other's checks out from under branch protection.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # The whole build, on every commit: fetch and prove the cross-compiler, build
  # the musl sysroot, cross-build every e2fsprogs program, stage what ships and
  # pack it.
  #
  # One job rather than several because every step depends on the tree the
  # previous one left behind, and this build is fast enough that splitting it
  # would cost more in artifact shuttling than it saved. Measured on macOS: 32 s
  # for the toolchain check, the sources and the musl sysroot, then 22 s for
  # e2fsprogs itself. Most of the wall-clock here is the cross-toolchain
  # download, not the compile.
  #
  # `release.yml` is triggered by hand, but it looks for a successful run of
  # this workflow on the commit being released and refuses to publish without
  # one - so this job is the gate a release passes.
  # -------------------------------------------------------------------------
  build:
    name: cross-build e2fsprogs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The container the sibling repositories build in. Releases are cut on
    # Linux because the cross-toolchain vendor - and therefore the binaries -
    # differs by build host, so CI builds on the host that cuts the release.
    #
    # NOTE: on Linux the Makefile takes bootlin's toolchain, where a
    # development machine takes messense's. This workflow is the first thing
    # that has ever exercised that path; the build was verified on macOS.
    container: debian:trixie-slim
    steps:
      # Before checkout on purpose: without git in the container,
      # actions/checkout silently falls back to downloading a tarball.
      #
      # `gcc` is the one entry ../make's otherwise identical list does not have,
      # and it is not decoration: e2fsprogs compiles and runs helper programs on
      # the build machine (util/subst, the CRC32c table generator,
      # util/parse-types.sh), so BUILD_CC has to be a real compiler for *this*
      # container. It also supplies /usr/bin/cc, which is the Makefile's
      # default BUILD_CC.
      #
      # xz-utils is not optional: bootlin ships its toolchain as .tar.xz and
      # `make dist` packs with xz -9.
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            make git curl ca-certificates xz-utils gcc

      - uses: actions/checkout@v5

      - name: Fetch the cross-toolchain
        run: make toolchain

      # Checked rather than assumed, and checked before anything expensive: a
      # toolchain for the wrong host extracts happily and then fails to exec,
      # one for the wrong target compiles happily and produces the wrong
      # binaries, and a missing host compiler would otherwise surface as a
      # missing util/subst two minutes into the build.
      - name: Prove it builds C against musl
        run: make toolchain-check

      - name: Download the e2fsprogs sources
        run: make sources

      # musl.libc.org is unreliable from a container - ../llvm measured four
      # consecutive single-shot fetches failing - which is why the Makefile's
      # curl carries --retry-all-errors.
      - name: Build the musl sysroot
        run: make sysroot

      # After `sysroot`, not before: this checks the musl tarball as well as the
      # e2fsprogs one, and musl is not downloaded until then.
      - name: Check the downloads against the pinned digests
        run: make verify-downloads

      - name: Prove C links dynamically against it
        run: make sysroot-check

      # `make e2fsprogs`: the aggregate goal is named after the product, as the
      # siblings' are.
      - name: Cross-build e2fsprogs
        run: make e2fsprogs

      - name: Stage what ships
        run: make stage

      # Reads every staged program back: aarch64, on the musl loader, depending
      # on nothing the card does not have, and with mkfs.ext4, fsck.ext4,
      # mke2fs.conf and the licences where they belong.
      - name: Verify the staged tree
        run: make stage-check

      # Run here too, so the release path is exercised on every commit rather
      # than for the first time during a release.
      - name: Pack the release asset
        run: make dist

      - name: What was built
        run: make toolchain-info sources-info sysroot-info build-info stage-info dist-info

      # The asset is ~644 KB. Uploading it from every branch is nearly free and
      # is the only way anyone gets a build onto a real board - which is still
      # the one thing neither this workflow nor the Makefile can prove.
      - uses: actions/upload-artifact@v5
        with:
          name: sepiaos-e2fsprogs
          path: dist/
          compression-level: 0
          if-no-files-found: error

      # configure and make are noisy and only interesting when they fail, so
      # the Makefile sends them to a log and surfaces only the tail. The full
      # logs are what a failure actually needs.
      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            build/target/configure.log
            build/target/build.log
            build/target/config.log
            build/musl/*/configure.log
            build/musl/*/build.log
          if-no-files-found: ignore
